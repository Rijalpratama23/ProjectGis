<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemetaan Rawan Banjir</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="shortcut icon" href="assets/kabupatenSukabumi-removebg-preview.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  </head>
  <body>
    <div>
      <div class="sidebar-container">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Cari Kecamatan..." />
          <button onclick="searchLocation()">🔍</button>
        </div>

        <div id="search-result" class="result-box" style="display: none">
          
          <h3>Hasil Pencarian</h3>
          <div class="result-item">
            <span class="label">Lokasi:</span>
            <span id="res-nama" class="value">-</span>
          </div>
          <div class="result-item">
            <span class="label">Koordinat:</span>
            <div class="value-coords">
              Lat: <span id="res-lat">-</span><br />
              Lng: <span id="res-lng">-</span>
            </div>
          </div>
          <div class="result-item">
            <span class="label">Status:</span>
            <span id="res-status" class="value badge">-</span>
          </div>
          <div class="result-item">
            <span class="label">Info:</span>
            <p id="res-desc" class="value-text">-</p>
          </div>
          <button onclick="resetSearch()" class="btn-reset">Reset / Tutup</button>
        </div>
      </div>

      <h1 class="judul">
        <div class="logo">
          <img src="assets/kabupatenSukabumi-removebg-preview.png" alt="logo" width="150px" />
        </div>
        Pemetaan Rawan Banjir <br />
        Kabupaten Sukabumi
      </h1>
    </div>
    <div id="map"></div>

    <div class="info-legend">
      <h4 style="margin: 0 0 15px 0">Zona Risiko Banjir</h4>
      <div class="legend-item">
        <div class="circle-color" style="background: red; border: 1px solid darkred"></div>
        <span>Bahaya (0 - 200m)</span>
      </div>
      <div class="legend-item">
        <div class="circle-color" style="background: orange; border: 1px solid darkorange"></div>
        <span>Waspada (200 - 500m)</span>
      </div>
      <div class="legend-item">
        <div class="circle-color" style="background: green; border: 1px solid darkgreen"></div>
        <span>Aman (500m - 1km)</span>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
