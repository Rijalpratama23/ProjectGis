<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Rawan Banjir</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      #map {
        height: 600px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Map Rawan Banjir</h1>
    <div id="map"></div>

    <script>
      // Inisialisasi peta
      var map = L.map('map').setView([-6.155996, 106.798127], 16);
      
      // --- Base Maps ---
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap',
      }).addTo(map);

      var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri',
      });

      // --- Overlay Layers ---
      var markerLayer = L.layerGroup();
      var polylineLayer = L.layerGroup();
      var polygonLayer = L.layerGroup();
      var banjirLayer = L.layerGroup(); // Layer untuk data banjir

      // Fungsi umum untuk bind popup
      function onEachFeature(feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindPopup(feature.properties.name);
        }
      }

      // Load Marker GeoJSON
      fetch('marker.geojson')
        .then((res) => res.json())
        .then((data) => {
          L.geoJSON(data, {
            onEachFeature: onEachFeature,
          }).addTo(markerLayer);
        })
        .catch(err => console.error('Error loading marker data:', err));

      // Load Polyline GeoJSON
      fetch('polyline.geojson')
        .then((res) => res.json())
        .then((data) => {
          L.geoJSON(data, {
            style: { color: 'blue' },
            onEachFeature: onEachFeature,
          }).addTo(polylineLayer);
        })
        .catch(err => console.error('Error loading polyline data:', err));

      // Load Polygon GeoJSON
      fetch('polygon.geojson')
        .then((res) => res.json())
        .then((data) => {
          L.geoJSON(data, {
            style: { color: 'red', fillOpacity: 0.3 },
            onEachFeature: onEachFeature,
          }).addTo(polygonLayer);
        })
        .catch(err => console.error('Error loading polygon data:', err));

      // Load data banjir GeoJSON
      fetch('map.geojson')
        .then((res) => res.json())
        .then((data) => {
          L.geoJSON(data, {
            style: function(feature) {
              // Berikan warna berbeda berdasarkan tingkat kerawanan banjir
              var warna = 'blue';
              if (feature.properties && feature.properties.tingkat) {
                if (feature.properties.tingkat === 'tinggi') warna = 'red';
                else if (feature.properties.tingkat === 'sedang') warna = 'orange';
                else if (feature.properties.tingkat === 'rendah') warna = 'yellow';
              }
              return {
                color: warna,
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.4
              };
            },
            onEachFeature: function (feature, layer) {
              var popupContent = feature.properties.name || 'Area Rawan Banjir';
              if (feature.properties.tingkat) {
                popupContent += '<br>Tingkat: ' + feature.properties.tingkat;
              }
              layer.bindPopup(popupContent);
            },
          }).addTo(banjirLayer);
        })
        .catch(err => console.error('Error loading flood data:', err));

      // --- Layer Control ---
      var baseMaps = {
        "OpenStreetMap": osm,
        "Satellite": satellite,
      };

      var overlayMaps = {
        "Area Rawan Banjir": banjirLayer,
        "Marker": markerLayer,
        "Polyline": polylineLayer,
        "Polygon": polygonLayer,
      };

      // Tambahkan kontrol layer ke peta
      L.control.layers(baseMaps, overlayMaps).addTo(map);

      // Atur layer yang aktif secara default
      banjirLayer.addTo(map); // Tampilkan layer banjir secara default
    </script>
  </body>
</html>
